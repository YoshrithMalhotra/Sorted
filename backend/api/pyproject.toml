[project]
name = "sorted-api"
version = "0.1.0"
description = "Sorted's backend API: turns a sentence into reminders, tasks, bills and shopping items."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "google-genai>=3.0",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sorted_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
